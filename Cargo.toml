[package]
name = "ebss"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Emergent Behavior Society Simulator - A general-purpose AI platform for simulating autonomous agent societies"
license = "MIT"
repository = "https://github.com/yourusername/ebss-project"
keywords = ["ai", "simulation", "emergent-behavior", "multi-agent", "game-ai"]
categories = ["simulation", "game-engines", "science"]

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:egui_plot"]
bevy_gui = ["gui", "dep:bevy", "dep:bevy_egui"]

[dependencies]
# Core dependencies
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Parallel processing
rayon = "1.7"

# Data structures
petgraph = "0.6"  # For behavior trees
dashmap = "5.5"   # Concurrent hash maps

# Configuration
toml = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
rmp-serde = "1.1"  # MessagePack

# GUI (optional, enabled with --features gui)
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", optional = true, features = ["all_loaders"] }
egui_plot = { version = "0.29", optional = true }

# Bevy GUI (optional, enabled with --features bevy_gui)
bevy = { version = "0.15", optional = true, default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "x11",
    "tonemapping_luts",
] }
bevy_egui = { version = "0.31", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[lib]
name = "ebss"
path = "src/lib.rs"

[[bin]]
name = "test_simulation"
path = "src/bin/test_simulation.rs"

[[bin]]
name = "ebss_gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "ebss_bevy"
path = "src/bin/bevy_gui.rs"
required-features = ["bevy_gui"]

[[example]]
name = "basic_survival"
path = "examples/basic_survival.rs"

[[example]]
name = "minecraft_world"
path = "examples/minecraft_world.rs"

[[example]]
name = "inspector_demo"
path = "examples/inspector_demo.rs"

[[example]]
name = "visual_demo"
path = "examples/visual_demo.rs"

[workspace]
members = ["plugins/*"]
