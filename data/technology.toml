name = "Protection of useful wild plants from trampling or fire"
path = "agricultural"
stage = 0
role = "technique"

[[tech]]
id = "agricultural.1.selective_harvesting"
name = "Selective harvesting"
path = "agricultural"
stage = 1
role = "technique"
model = ["know:selective_harvest"]
note = "Taking from a wild stand near home and leaving a quarter of it, the young plants and the seed, which keeps the stand. Found out by coming back to the stands near home often enough (Agent::RETURNS_BEFORE_SPARING) (#380)."

[[tech]]
id = "agricultural.1.broadcast_sowing_of_gathered_seed"
name = "Broadcast sowing of gathered seed"
path = "agricultural"
stage = 1
role = "technique"
model = ["do:ScatterSeed"]
note = "Found out by seeing seed come up where it was thrown away or dropped (what_was_dropped_comes_up, what_was_dropped_takes_root), or by watching somebody do it."

[[tech]]
id = "agricultural.1.weeding_around_useful_plants"
name = "Weeding around useful plants"
path = "agricultural"
stage = 1
role = "technique"
model = ["do:TendField"]
needs = ["agricultural.1.broadcast_sowing_of_gathered_seed"]

[[tech]]
id = "agricultural.1.controlled_burning"
name = "Controlled burning"
path = "agricultural"
stage = 1
role = "technique"
model = ["do:BurnOff"]
note = "A patch near home burnt off in the dry season, off the camp's own ground, where what stands is less than the flush would add; the flush carries up to twice and comes back up to twice as fast, fading over a year. Found out by gathering often enough on ground a fire went over (lightning fires, World::the_dry_country_burns), or by watching it done (#381)."

[[tech]]
id = "agricultural.1.coppicing_and_pruning_of_useful_trees"
name = "Coppicing and pruning of useful trees/shrubs"
path = "agricultural"
stage = 1
role = "technique"
model = ["know:coppice", "know:selective_harvest"]
note = "Wood near home cut back to the stool, which comes back up to twice as fast and carries up to twice, growing out over about three years uncut. Found out by cutting wood near home often enough, about six months of it (Agent::CUTS_BEFORE_COPPICING) (#382). The fruit and nut shrubs are kept by selective harvesting (#380)."

[[tech]]
id = "agricultural.1.water_diversion_on_a_very_small"
name = "Water diversion on a very small scale"
path = "agricultural"
stage = 1
role = "technique"
model = ["do:DigDitch"]
note = "A ditch from water within four cells to a patch of wild stands near home on ground drier than a plant likes (hills, mountain, desert, salt flat), which brings what the ground holds up to the middle of what a plant does best on, silting up over half a year. Found out by gathering often enough from such stands with water close by, or by watching it done (#383)."

[[tech]]
id = "agricultural.1.larger_stands_of_desired_grains_nuts"
name = "Larger stands of desired grains, nuts, berries, and tubers"
path = "agricultural"
stage = 1
role = "product"
model = ["know:selective_harvest"]
same_as = ["agricultural.1.selective_harvesting"]
note = "What selective harvesting comes to: a kept stand carries up to twice what the wild one did and comes back as much faster (ResourceNode::tended, #380)."

