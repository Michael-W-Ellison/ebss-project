[package]
name = "minecraft_survival"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Minecraft-style survival environment plugin for EBSS"

[dependencies]
ebss = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
noise = "0.9"

[lib]
name = "minecraft_survival"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
